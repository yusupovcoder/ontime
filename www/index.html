<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Защита: разрешены только файлы самого приложения. Сторонние скрипты, стили, шрифты и запросы заблокированы. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>On Time</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-tile"><svg viewBox="0 0 100 100">
    <defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F8BFF"/><stop offset="1" stop-color="#5E5CE6"/></linearGradient>
      <radialGradient id="ih" cx="0.3" cy="0.15" r="0.9"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
    <rect width="100" height="100" fill="url(#ig)"/><rect width="100" height="100" fill="url(#ih)"/>
    <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
      <circle class="i-ring" cx="50" cy="50" r="30" stroke-width="4.8" pathLength="100" transform="rotate(-64.8 50 50)"/>
      <path class="i-check" d="M37.4 50.6 L47 60.2 L64.4 41" stroke-width="5" pathLength="100"/>
    </g>
    <circle class="i-dot" cx="50" cy="20" r="2.7" fill="#fff"/>
  </svg></div>
  <div class="intro-name">On Time</div>
</div>

<div class="ambient" aria-hidden="true"></div>
<div class="edge-top" aria-hidden="true"></div>
<div class="edge-bottom" aria-hidden="true"></div>

<div class="app">
  <section class="screen" id="scr-tasks" aria-label="Задания"></section>
  <section class="screen" id="scr-cal" aria-label="Календарь" hidden></section>
  <section class="screen" id="scr-sched" aria-label="Пары" hidden></section>
  <section class="screen" id="scr-focus" aria-label="Фокус" hidden></section>
  <section class="screen" id="scr-grades" aria-label="Оценки" hidden></section>
  <section class="screen" id="scr-settings" aria-label="Настройки" hidden></section>
</div>

<nav class="tabbar glass" aria-label="Разделы">
  <div class="tabbar-in" id="tabbar"></div>
</nav>

<div class="overlay" id="sheetOv" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-nav">
      <button type="button" class="nav-btn glass glass-btn" id="sheetLeft" aria-label="Отмена"></button>
      <h2 id="sheetTitle"></h2>
      <button type="button" class="nav-btn right glass glass-btn" id="sheetRight"></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="overlay as-ov" id="asOv" hidden>
  <div class="as" role="alertdialog" aria-modal="true" aria-labelledby="asTitle" aria-describedby="asMsg">
    <div class="as-group">
      <div class="as-head"><p class="as-title" id="asTitle"></p><p class="as-msg" id="asMsg"></p></div>
      <button type="button" class="as-btn" id="asOk"></button>
    </div>
    <div class="as-cancel"><button type="button" class="as-btn" id="asCancel">Отмена</button></div>
  </div>
</div>

<input type="file" id="importFile" accept=".json,application/json" class="sr-only" tabindex="-1" aria-hidden="true">
<div class="toast glass" id="toast" hidden role="status"></div>
<div class="menu-scrim" id="menuScrim" hidden></div>
<div class="menu" id="menuPop" role="listbox" hidden></div>

<script src="app.js"></script>
</body>
</html>
